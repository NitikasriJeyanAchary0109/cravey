name: CI

on:
  push:
    branches: [ main, master, drops-payments, drops-hardening, pre-launch-verification, core-polish ]
  pull_request:
    branches: [ main, master, drops-payments, drops-hardening ]

jobs:
  changes:
    name: Path Filters
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            flutter:
              - 'lib/**'
              - 'test/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'

  backend:
    name: Backend CI (Fast H2 + Postgres Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Run Maven Clean Verify (Fast H2 Suite + Testcontainers Postgres Suite)
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          STRIPE_SECRET_KEY: sk_test_mock_secret_key
          STRIPE_PUBLIC_KEY: pk_test_mock_public_key
          STRIPE_WEBHOOK_SECRET: whsec_test_mock_secret
          JWT_SECRET: test-jwt-secret-key-that-is-at-least-256-bits-long-for-testing-purposes-123456
        run: |
          set -o pipefail
          ./mvnw clean verify -Ppostgres --batch-mode 2>&1 | tee "$RUNNER_TEMP/mvn.log"

      - name: Surface Maven errors as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          log = open(os.path.join(os.environ['RUNNER_TEMP'], 'mvn.log'), errors='replace').read().splitlines()
          errs = [l for l in log if '[ERROR]' in l or 'FAIL' in l or 'Tests run:' in l and 'Failures: 0, Errors: 0' not in l]
          text = '%0A'.join(errs[:40])[:3500]
          print('::error title=Maven failure::' + text)
          PY

  flutter:
    name: Flutter CI
    needs: changes
    if: ${{ needs.changes.outputs.flutter == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: dart analyze

      - name: Run Flutter Tests
        run: flutter test
